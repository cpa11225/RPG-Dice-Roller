<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPG Dice Roller</title>
  <meta name="description" content="Offline 3D physics RPG dice roller (single file)" />
  <style>
    :root {
      --bg: #1a1510;
      --panel: #2a2118;
      --panel-border: #4a3a28;
      --accent: #c9a227;
      --accent-dim: #8a7020;
      --text: #e8dcc8;
      --muted: #a09078;
      --success: #6baf6b;
      --danger: #c45c5c;
      --die-face: #3d3228;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 30% 20%, #2a2015 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, #1e1810 0%, transparent 40%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .table {
      width: 100%;
      max-width: 680px;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 12px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(201,162,39,0.15);
      padding: 1.75rem;
    }
    h1 {
      font-size: 1.6rem;
      text-align: center;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .section {
      margin-bottom: 1.25rem;
    }
    .label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .dice-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }
    @media (max-width: 400px) {
      .dice-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .die-btn {
      background: var(--die-face);
      border: 2px solid var(--panel-border);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.65rem 0.4rem;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .die-btn:hover {
      border-color: var(--accent-dim);
      background: #4a3d30;
    }
    .die-btn.selected {
      border-color: var(--accent);
      background: #4a3820;
      color: var(--accent);
      box-shadow: 0 0 10px rgba(201,162,39,0.25);
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .field {
      display: flex;
      flex-direction: column;
    }
    select, input[type="number"] {
      background: var(--die-face);
      border: 2px solid var(--panel-border);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      outline: none;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--accent-dim);
    }
    .adv-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .adv-btn {
      flex: 1;
      background: var(--die-face);
      border: 2px solid var(--panel-border);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .adv-btn:hover { border-color: var(--accent-dim); color: var(--text); }
    .adv-btn.active-adv {
      border-color: var(--success);
      color: var(--success);
      background: #2a3a28;
    }
    .adv-btn.active-dis {
      border-color: var(--danger);
      color: var(--danger);
      background: #3a2828;
    }
    .adv-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .roll-btn {
      width: 100%;
      margin-top: 1.25rem;
      background: linear-gradient(180deg, #d4b030 0%, #a08020 100%);
      border: none;
      color: #1a1510;
      font-family: inherit;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(201,162,39,0.35);
      transition: transform 0.1s, box-shadow 0.15s;
    }
    .roll-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(201,162,39,0.45);
    }
    .roll-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(201,162,39,0.3);
    }
    .stage { width:100%; height:340px; margin-top:1.25rem; border-radius:10px; overflow:hidden; border:2px solid var(--panel-border); background:#173f25; }
    .roll-btn:disabled { opacity:0.6; cursor:wait; }
    .result {
      margin-top: 1.5rem;
      min-height: 7rem;
      background: #16120e;
      border: 2px solid var(--panel-border);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }
    .result.empty {
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: italic;
    }
    .faces {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 0.75rem;
    }
    .face {
      background: var(--die-face);
      border: 1px solid var(--accent-dim);
      color: var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
      min-width: 2.4rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
    }
    .face.dropped {
      opacity: 0.35;
      text-decoration: line-through;
      border-color: var(--panel-border);
      color: var(--muted);
    }
    .face.kept-high { border-color: var(--success); color: var(--success); }
    .face.kept-low { border-color: var(--danger); color: var(--danger); }
    .notation-line {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
    }
    .total-line {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }
    .total-line .mod {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="table">
    <h1>⚔ RPG Dice</h1>
    <p class="subtitle">Tabletop roller · offline</p>

    <div class="section">
      <span class="label">Dice type</span>
      <div class="dice-grid" id="diceGrid"></div>
    </div>

    <div class="section controls">
      <div class="field">
        <label class="label" for="count">Count</label>
        <select id="count"></select>
      </div>
      <div class="field">
        <label class="label" for="modifier">Modifier</label>
        <input type="number" id="modifier" value="0" step="1" />
      </div>
    </div>

    <div class="section">
      <span class="label">d20 options</span>
      <div class="adv-row">
        <button type="button" class="adv-btn" id="advBtn" disabled>Advantage</button>
        <button type="button" class="adv-btn" id="disBtn" disabled>Disadvantage</button>
      </div>
    </div>

    <button type="button" class="roll-btn" id="rollBtn">ROLL</button>

    <div class="stage" id="stage"></div>

    <div class="result empty" id="result">Ready to roll</div>
  </div>

  </script>
  <script>
    const DICE = [4, 6, 8, 10, 12, 20, 100];
    let selectedSides = 20;
    let advMode = null; // null | 'adv' | 'dis'

    const diceGrid = document.getElementById('diceGrid');
    const countSel = document.getElementById('count');
    const modInput = document.getElementById('modifier');
    const advBtn = document.getElementById('advBtn');
    const disBtn = document.getElementById('disBtn');
    const rollBtn = document.getElementById('rollBtn');
    const resultEl = document.getElementById('result');

    DICE.forEach(sides => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'die-btn' + (sides === selectedSides ? ' selected' : '');
      btn.textContent = sides === 100 ? 'd100' : 'd' + sides;
      btn.dataset.sides = sides;
      btn.addEventListener('click', () => selectDie(sides));
      diceGrid.appendChild(btn);
    });

    for (let i = 1; i <= 20; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      if (i === 1) opt.selected = true;
      countSel.appendChild(opt);
    }

    function selectDie(sides) {
      selectedSides = sides;
      document.querySelectorAll('.die-btn').forEach(b => {
        b.classList.toggle('selected', Number(b.dataset.sides) === sides);
      });
      const isD20 = sides === 20;
      advBtn.disabled = !isD20;
      disBtn.disabled = !isD20;
      if (!isD20) {
        advMode = null;
        updateAdvButtons();
      }
    }

    function updateAdvButtons() {
      advBtn.classList.toggle('active-adv', advMode === 'adv');
      disBtn.classList.toggle('active-dis', advMode === 'dis');
    }

    advBtn.addEventListener('click', () => {
      if (advBtn.disabled) return;
      advMode = advMode === 'adv' ? null : 'adv';
      updateAdvButtons();
    });
    disBtn.addEventListener('click', () => {
      if (disBtn.disabled) return;
      advMode = advMode === 'dis' ? null : 'dis';
      updateAdvButtons();
    });

    function randDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    // ---- 3D dice: physical results feed the original math below ----
    let dice3dOK = false;
    try { Dice3D.init(document.getElementById('stage')); dice3dOK = true; }
    catch (e) { console.warn('3D dice unavailable, using Math.random fallback', e); document.getElementById('stage').style.display = 'none'; }
    let pending = [];
    function randDie3D(sides) { return pending.length ? pending.shift() : randDie(sides); }
    function specsFor(sides, count, adv) {
      const n = (sides === 20 && adv) ? 2 : count;
      const s = [];
      for (let i = 0; i < n; i++) {
        if (sides === 100) { s.push({ kind: 'd100t' }); s.push({ kind: 'd100u' }); }
        else s.push({ kind: 'd' + sides });
      }
      return s;
    }
    function toValues(sides, res) {
      if (sides === 100) {
        const out = [];
        for (let i = 0; i < res.length; i += 2) { const v = res[i].value + res[i + 1].value; out.push(v === 0 ? 100 : v); }
        return out;
      }
      if (sides === 10) return res.map(r => r.value); // faces 1-10
      return res.map(r => r.value);
    }
    let rolling = false;
    async function roll(opts) {
      if (rolling) return;
      if (dice3dOK) {
        rolling = true; rollBtn.disabled = true; rollBtn.textContent = 'ROLLING...';
        Dice3D.initAudio();
        try {
          const res = await Dice3D.roll(specsFor(selectedSides, Number(countSel.value), advMode), opts || {});
          pending = toValues(selectedSides, res);
          window.__lastDice = { sides: selectedSides, adv: advMode, raw: res, values: pending.slice() };
        } catch (e) { console.error(e); pending = []; }
        rolling = false; rollBtn.disabled = false; rollBtn.textContent = 'ROLL';
      }
      rollMath();
    }

    function rollMath() {
      const count = Number(countSel.value);
      const mod = Number(modInput.value) || 0;
      const sides = selectedSides;
      let rolls = [];
      let kept = [];
      let notation = '';

      if (sides === 20 && advMode) {
        const a = randDie3D(20);
        const b = randDie3D(20);
        rolls = [a, b];
        const pick = advMode === 'adv' ? Math.max(a, b) : Math.min(a, b);
        kept = [pick];
        notation = '1d20' + (advMode === 'adv' ? ' (adv)' : ' (dis)');
        if (mod !== 0) notation += (mod > 0 ? '+' : '') + mod;
      } else {
        for (let i = 0; i < count; i++) rolls.push(randDie3D(sides));
        kept = rolls.slice();
        notation = count + 'd' + sides;
        if (mod !== 0) notation += (mod > 0 ? '+' : '') + mod;
      }

      const sum = kept.reduce((a, b) => a + b, 0);
      const total = sum + mod;

      resultEl.classList.remove('empty');
      let facesHtml = '<div class="faces">';
      if (sides === 20 && advMode) {
        const pick = kept[0];
        rolls.forEach(r => {
          const cls = r === pick
            ? (advMode === 'adv' ? 'face kept-high' : 'face kept-low')
            : 'face dropped';
          // If both equal, mark both as kept-looking once
          facesHtml += '<span class="' + cls + '">' + r + '</span>';
        });
        // Fix: if both rolls equal, both should look kept
        if (rolls[0] === rolls[1]) {
          facesHtml = '<div class="faces">';
          rolls.forEach(r => {
            const cls = advMode === 'adv' ? 'face kept-high' : 'face kept-low';
            facesHtml += '<span class="' + cls + '">' + r + '</span>';
          });
        }
      } else {
        rolls.forEach(r => {
          facesHtml += '<span class="face">' + r + '</span>';
        });
      }
      facesHtml += '</div>';

      const modStr = mod === 0 ? '' : (
        ' <span class="mod">(' + sum + (mod > 0 ? ' + ' : ' − ') + Math.abs(mod) + ')</span>'
      );

      resultEl.innerHTML =
        '<div class="notation-line">' + notation + '</div>' +
        facesHtml +
        '<div class="total-line">Total: ' + total + modStr + '</div>';
    }

    rollBtn.addEventListener('click', () => roll());

    // Keyboard: Enter / Space on roll focus
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.activeElement !== modInput) {
        e.preventDefault();
        roll();
      }
    });

    selectDie(20);
  </script>
